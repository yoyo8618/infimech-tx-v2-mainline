#####################################################################
# Stock touchscreen support
#
# Macros the stock screen calls by name, and the status messages it
# waits for. Not needed with HelixScreen or another Klipper screen.
#####################################################################

# Bed mesh with the start/end messages the screen follows. Adaptive
# meshing is Klipper's own (BED_MESH_CALIBRATE ADAPTIVE=1 from the
# slicer, using the objects the slicer labels).
# changed: no longer saves the config after every mesh (stock did, which
# restarts mainline Klipper in the middle of a print)
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        M118 homed_axes_no_ready
        M104 S130
        G28
        M190 S60
        M109 S130
    {% endif %}
    M118 BED_MESH_CALIBRATE_START
    BED_SENSOR_MODE MODE=MESH
    _BED_MESH_CALIBRATE_BASE {rawparams}
    BED_SENSOR_MODE MODE=NORMAL
    M118 BED_MESH_CALIBRATE_END
    G4 P3000

# Screen: "Auto leveling". Z tilt plus a full mesh, then saves it
# (SAVE_CONFIG restarts Klipper, as the stock macro did at the end).
[gcode_macro autolevelling]
gcode:
    {% set bed_mesh_switch_value = printer.save_variables.variables.bed_mesh_switch_value|default(1) %}
    BED_MESH_CLEAR
    M104 S130
    M140 S60
    G28
    M190 S60
    M109 S130
    Z_TILT_ADJUST
    BED_MESH_SWITCH SWITCH=1
    G28
    BED_MESH_CALIBRATE
    BED_MESH_SWITCH SWITCH={bed_mesh_switch_value}
    G4 P3000
    SAVE_CONFIG

# Screen: mesh on/off switch (stored in saved_variables.cfg)
[gcode_macro BED_MESH_SWITCH]
gcode:
    {% set SWITCH = params.SWITCH|default(1)|int %}
    M118 params.switch={SWITCH}
    SAVE_VARIABLE VARIABLE=bed_mesh_switch_value VALUE={SWITCH}

# Screen: input shaper calibration
[gcode_macro FX_SHAPER_CALIBRATE]
gcode:
    M118 FX_SHAPER_CALIBRATE Start
    M104 S45
    SHAPER_CALIBRATE
    M118 FX_SHAPER_CALIBRATE End

# Screen: purge line ("huaxian" = draw a line)
[gcode_macro PRINT_HUAXIAN]
gcode:
    G1 Z5 F3000
    G92 E0
    G90
    G0 X5 Y1 F6000
    G0 Z0.4
    G91
    G1 X100 E20 F1200
    G1 Y1
    G1 X-100 E20 F1200
    G0 Z5
    G1 E-5.0 F3600
    G92 E0
    G90

# Debug macro from the stock config, kept in case the screen calls it
[gcode_macro LOOK]
gcode:
    {% set heater_extruder_target = printer.extruder.target|float %}
    M118 heater_extruder_target = { heater_extruder_target }
    M118 {printer.toolhead.homed_axes}
    M118{printer.print_stats.state}
    {% if printer.print_stats.state == "printing" %}
        M118 11 {printer.print_stats.state}
    {% endif %}

[save_variables]
filename: @H@/printer_data/saved_variables.cfg
