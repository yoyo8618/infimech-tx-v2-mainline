#####################################################################
# Fans, stock style (active while the stock touchscreen is in use)
#
# The fans are plain PWM outputs named fan0..fan3, driven by the M106
# macro below, exactly as on the stock printer:
#   M106 S<0-255>        fan0  part cooling fan
#   M106 P1 S<0-255>     fan1  second part cooling output
#   M106 P2 S<0-255>     fan2  auxiliary (side) fan
#   M106 P3 S<0-255>     fan3  filter fan  (also M106 T-2)
#
# fans_mainline.cfg is the same hardware as real Klipper fans; swap the
# include in printer.cfg once the stock screen is no longer used.
#####################################################################

[output_pin fan0]
pin: PC9
pwm: True
cycle_time: 0.0100
hardware_pwm: False
value: 0
scale: 255
shutdown_value: 0.0

[output_pin fan1]
pin: PA9
pwm: True
cycle_time: 0.0100
hardware_pwm: False
value: 0
scale: 255
shutdown_value: 0.0

[output_pin fan2]
pin: PA8
pwm: True
cycle_time: 0.0100
hardware_pwm: False
value: 0
scale: 255
shutdown_value: 0.0

[output_pin fan3]
pin: rpi:gpio225
pwm: True
cycle_time: 0.0100
hardware_pwm: False
value: 0
scale: 255
shutdown_value: 0.0

[gcode_macro M106]
description: Set fan speed (S0-255, P0-3; T-2 = filter fan)
gcode:
    {% set s = params.S|default(255)|int %}
    {% if params.P is defined %}
        SET_PIN PIN=fan{params.P|int} VALUE={s}
    {% endif %}
    {% if params.T is defined and params.T|int == -2 %}
        SET_PIN PIN=fan3 VALUE={s}
    {% endif %}
    {% if params.P is undefined and params.T is undefined %}
        SET_PIN PIN=fan0 VALUE={s}
    {% endif %}

# Used by PAUSE / RESUME (macros.cfg) to put the fans back after a pause
[gcode_macro _SAVE_FANS]
variable_fan0: 0
variable_fan2: 0
variable_fan3: 0
gcode:
    M400
    {% for f in ["fan0", "fan2", "fan3"] %}
        SET_GCODE_VARIABLE MACRO=_SAVE_FANS VARIABLE={f} VALUE={(printer["output_pin " ~ f].value * 255)|round|int}
    {% endfor %}

[gcode_macro _RESTORE_FANS]
gcode:
    {% set saved = printer["gcode_macro _SAVE_FANS"] %}
    M106 S{saved.fan0}
    M106 P2 S{saved.fan2}
    M106 P3 S{saved.fan3}
