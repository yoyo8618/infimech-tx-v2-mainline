#####################################################################
# Fans, mainline style (active since package 11)
#
# The same four fans as fans_stock.cfg, as real Klipper fan sections, so
# Fluidd and HelixScreen show and control them. The names tell
# HelixScreen what each fan is. M106 keeps the stock meaning:
#   M106 S<0-255>      [fan]                  part cooling fan   (PC9)
#   M106 P1 S<0-255>   [fan_generic fan1]     second output      (PA9)
#   M106 P2 S<0-255>   [fan_generic aux_fan]  auxiliary fan      (PA8)
#   M106 P3 S<0-255>   [fan_generic filter_fan] filter fan       (rpi:gpio225)
#                      (M106 T-2 also sets the filter fan)
# M107 [P1-3] turns one off. Klipper gives each fan a 0.1 s full-power
# start pulse when it starts from off, so low speeds start reliably.
#
# Back to the stock style: in printer.cfg replace
#     [include fans_mainline.cfg]   with   [include fans_stock.cfg]
# (the stock screen expects that style; see infimech/fans_unswitch.sh)
#####################################################################

[fan]
pin: PC9
cycle_time: 0.0100
hardware_pwm: False
shutdown_speed: 0

[fan_generic fan1]
pin: PA9
cycle_time: 0.0100
hardware_pwm: False
shutdown_speed: 0

[fan_generic aux_fan]
pin: PA8
cycle_time: 0.0100
hardware_pwm: False
shutdown_speed: 0

[fan_generic filter_fan]
pin: rpi:gpio225
cycle_time: 0.0100
hardware_pwm: False
shutdown_speed: 0

[gcode_macro M106]
description: Set fan speed (S0-255, P0-3; T-2 = filter fan)
rename_existing: M99106
variable_names: {1: "fan1", 2: "aux_fan", 3: "filter_fan"}
gcode:
    {% set s = [[params.S|default(255)|float, 0]|max, 255]|min %}
    {% set p = params.P|default(0)|int %}
    {% if params.T is defined and params.T|int == -2 %}
        {% set p = 3 %}
    {% endif %}
    {% if p == 0 %}
        M99106 S{s}
    {% elif p in names %}
        SET_FAN_SPEED FAN={names[p]} SPEED={s / 255}
    {% else %}
        {action_raise_error("M106: no fan P%d (use P0-P3)" % p)}
    {% endif %}

[gcode_macro M107]
description: Turn a fan off (P0-3, default the part cooling fan)
rename_existing: M99107
gcode:
    {% set names = printer["gcode_macro M106"].names %}
    {% set p = params.P|default(0)|int %}
    {% if p == 0 %}
        M99107
    {% elif p in names %}
        SET_FAN_SPEED FAN={names[p]} SPEED=0
    {% else %}
        {action_raise_error("M107: no fan P%d (use P0-P3)" % p)}
    {% endif %}

# Used by PAUSE / RESUME (macros.cfg) to put the fans back after a pause
[gcode_macro _SAVE_FANS]
variable_fan0: 0
variable_fan2: 0
variable_fan3: 0
gcode:
    M400
    SET_GCODE_VARIABLE MACRO=_SAVE_FANS VARIABLE=fan0 VALUE={(printer.fan.speed * 255)|round|int}
    SET_GCODE_VARIABLE MACRO=_SAVE_FANS VARIABLE=fan2 VALUE={(printer["fan_generic aux_fan"].speed * 255)|round|int}
    SET_GCODE_VARIABLE MACRO=_SAVE_FANS VARIABLE=fan3 VALUE={(printer["fan_generic filter_fan"].speed * 255)|round|int}

[gcode_macro _RESTORE_FANS]
gcode:
    {% set saved = printer["gcode_macro _SAVE_FANS"] %}
    M106 S{saved.fan0}
    M106 P2 S{saved.fan2}
    M106 P3 S{saved.fan3}
