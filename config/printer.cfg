#OCTO-printer.cfg-v1.0.1-20240925
#####################################################################
# Infimech TX V2 - mainline Klipper (clean layout)
#
#   printer_config.cfg  hardware: pins, motors, heaters, probe, mesh
#   fans_mainline.cfg   fans as real Klipper fans (fans_stock.cfg: stock style)
#   macros.cfg          homing, nozzle wipe, start/end, pause/resume
#   screen.cfg          macros and messages the stock touchscreen uses
#   infimech.cfg        Klipper features and the Infimech add-ons
#   init.cfg            light on/off at start-up (written by the screen)
#
# Calibration values are kept in this file, because SAVE_CONFIG can
# only update values that are in the main file or in its own block.
#####################################################################

[include fluidd.cfg]
[include timelapse.cfg]
[include printer_config.cfg]
[include fans_mainline.cfg]
[include macros.cfg]
[include screen.cfg]
[include infimech.cfg]
[include init.cfg]
#[include TEST_SPEED.cfg]   # optional: Ellis' TEST_SPEED macro, not included here

[virtual_sdcard]
path: /home/gem/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[mcu rpi]
serial: /tmp/klipper_host_mcu

#--------------------------------------------------------------------
# Calibration - values from ONE TX V2, as a starting point. Re-tune yours:
#   PID_CALIBRATE HEATER=extruder TARGET=250    then SAVE_CONFIG
#   PID_CALIBRATE HEATER=heater_bed TARGET=60   then SAVE_CONFIG
#   SHAPER_CALIBRATE (adxl345 on the toolhead)  then SAVE_CONFIG
#   z_offset: adjust with a first-layer test
# SAVE_CONFIG writes its block at the end of this file and removes the
# values below that it replaces.
#--------------------------------------------------------------------
[smart_effector]
z_offset: 0.0

[extruder]
control: pid
pid_Kp: 33.909
pid_Ki: 5.382
pid_Kd: 53.407

[heater_bed]
control: pid
pid_Kp: 66.771
pid_Ki: 0.814
pid_Kd: 1369.644

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 57.6
shaper_type_y: mzv
shaper_freq_y: 54.8

[skew_correction]
# empty; PRINT_START loads a skew profile named "default" if you make one
