#####################################################################
# Klipper features and Infimech add-ons
#####################################################################

# Infimech compatibility module (klippy/extras/infimech_compat.py):
#  - retries a probe that reports "Probe triggered prior to movement"
#  - STEPPER_BUZZ_TEST_1 / _2 for the screen's self-test
#  - SAVE_CONFIG during a print saves without restarting Klipper
[infimech_compat]

# Piezo bed sensor board on the host I2C bus (infimech_bed_sensor.py):
# BED_SENSOR_READ shows the live values and thresholds.
# manage_thresholds: who sets the trigger thresholds
#   off      the stock screen does (while it is in use)
#   compare  the stock screen does; Klipper works them out the same way
#            and prints "Bed sensor check: Klipper ... screen ..."
#   on       Klipper does (only without the stock screen)
#   auto     compare while the stock screen is running, on when it is not
#            (HelixScreen); checked at every bed shake
[infimech_bed_sensor]
i2c_mcu: rpi
i2c_bus: i2c.2
manage_thresholds: auto
#thresholds: 250, 250, 250, 250

[respond]
# the stock screen reads messages that start with "status:"
default_prefix: status:

[pause_resume]

[exclude_object]

[gcode_arcs]
resolution: 0.2

[force_move]
enable_force_move: True

[idle_timeout]
# 15 minutes; during a pause only the nozzle heater is turned off
timeout: 900
gcode:
    {% if printer.pause_resume.is_paused %}
        M104 S0
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}
