#####################################################################
# Infimech TX V2 - motion and print macros
#
# The moves, speeds, temperatures and status messages are the stock
# Infimech ones; the stock screen follows the "M118 ..." messages, so
# they are kept word for word. Fixes are marked "changed:".
#####################################################################

#--------------------------------------------------------------------
# Homing: sensorless X/Y at reduced current, Z with the bed probe
#--------------------------------------------------------------------
[homing_override]
set_position_z: 0
gcode:
    # Keep every SET_TMC_CURRENT below, even where the current is already
    # 0.7 A. Each one is queued behind the move before it, so the X/Y driver
    # only switches to stall-detection mode once the head has stopped.
    # Without them, X/Y homing can stop short of the end of the axis.
    {% set home_cur = 0.7 %}
    {% set x_run = printer.configfile.settings['tmc2209 stepper_x'].run_current %}
    {% set y_run = printer.configfile.settings['tmc2209 stepper_y'].run_current %}
    {% set x = params.X is defined %}
    {% set y = params.Y is defined %}
    {% set z = params.Z is defined %}
    # G28 or G28 X Y Z homes everything.
    # changed: G28 X Z and G28 Y Z also home everything (stock homed nothing)
    {% set all = (not x and not y and not z) or (z and (x or y)) %}
    G1 Z6 F400
    SET_VELOCITY_LIMIT ACCEL=500
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_cur}
    G4 P200
    {% if all or (x and y) %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_cur}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_cur}
        SET_KINEMATIC_POSITION X=217
        SET_KINEMATIC_POSITION Y=220
        G91
        G1 X3 F2000
        G1 Y3 F2000
        G90
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_cur}
        G4 P200
        G28 X
        G90
        G1 X5 F3000
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_cur}
        G4 P200
        G28 Y
        G90
        G1 Y10 F3000
        {% if all %}
            G4 P100
        {% endif %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_cur}
        G4 P200
        G28 X
        {% if all %}
            G1 X110 Y110 F10000
            _HOME_Z_PROBE START=255 SPEED=1500 PAUSE=1
        {% else %}
            G90
            G1 X10 F3000
            G90
        {% endif %}
    {% elif x %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_cur}
        SET_KINEMATIC_POSITION X=217
        G91
        G1 X3 F2000
        G90
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_cur}
        G4 P200
        G28 X
        G1 X10 F1000
    {% elif y %}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_cur}
        SET_KINEMATIC_POSITION Y=220
        G91
        G1 Y3 F2000
        G90
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_cur}
        G4 P200
        G28 Y
        G1 Y10 F3000
    {% else %}
        _HOME_Z_PROBE START=250 SPEED=300 PAUSE=0
        M114
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={x_run}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={y_run}
    M114
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity|int}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel|int}
    G90
    M118 homing_override end

# Z homing with the bed probe (only called from homing_override above)
[gcode_macro _HOME_Z_PROBE]
gcode:
    SET_KINEMATIC_POSITION Z={params.START}
    G91
    G1 Z-3 F300
    G90
    Z_DOUDONG
    M118 homing_override start
    BED_SENSOR_MODE MODE=HOMING
    PROBE
    SET_KINEMATIC_POSITION Z=0
    G90
    {% if params.PAUSE|int %}
        G4 P100
    {% endif %}
    G1 Z10 F{params.SPEED}
    BED_SENSOR_MODE MODE=NORMAL

# Shakes the bed so the piezo sensor settles, and tells the sensor board.
# The BED_SENSOR_* lines measure the sensor noise during the shake and set
# the trigger thresholds from it (the stock screen does this while it is
# in use; they do nothing unless manage_thresholds is set in infimech.cfg).
[gcode_macro Z_DOUDONG]
gcode:
    G4 P500
    M118 Z_DOUDONG start
    BED_SENSOR_CALIBRATE ACTION=START
    SET_PIN PIN=test_Z VALUE=1
    G91
    {% for i in range(80) %}
        G1 Z1 F5000
        G1 Z-1
    {% endfor %}
    G90
    SET_PIN PIN=test_Z VALUE=0
    M118 Z_DOUDONG stop
    BED_SENSOR_CALIBRATE ACTION=STOP
    G4 P1000

#--------------------------------------------------------------------
# Nozzle wipe before a print (first line of the slicer start G-code)
#--------------------------------------------------------------------
[gcode_macro clean_nozzle_position]
description: Clean nozzle and preheat using slicer-specified bed temp
variable_bed_temp: 60
gcode:
    {% set bed_temp = params.BED_TEMP|default(bed_temp)|float %}
    M118 Cleaning nozzle — heating bed to {bed_temp}°C
    M140 S{bed_temp}
    M104 S170
    G28 X Y
    G91
    G1 Z-2.5 F300
    G90
    # probe at the front edge, heat, purge
    G1 X130 Y-1.5 F12000
    Z_DOUDONG
    SET_KINEMATIC_POSITION Z=255
    PROBE SAMPLES=3 SAMPLE_RETRACT_DIST=2 SAMPLES_TOLERANCE=0.1
    SET_KINEMATIC_POSITION Z=0
    M104 S250
    G1 Z10 F1000
    M106 S255
    G1 X130 Y-4.5 F400
    M118 nozzle heating start
    M109 S250
    M118 nozzle heating end
    M118 nozzle cleaning start
    G92 E0
    G1 E25 F200
    G4 P2000
    G92 E0
    G1 E-5.0 F3600
    M104 S190
    M106 S255
    # drag along the front edge
    G1 Z5 F8000
    G1 X137 Y-1.5 F10000
    G1 X86 Y-1.5 F12000
    SET_KINEMATIC_POSITION Z=100
    PROBE SAMPLES=2 SAMPLE_RETRACT_DIST=2 SAMPLES_TOLERANCE=0.1
    SET_KINEMATIC_POSITION Z=0
    G1 X80 Y-1.5 F50
    M104 S190
    M106 S255
    SET_KINEMATIC_POSITION Z=100
    PROBE SAMPLES=2 SAMPLE_RETRACT_DIST=1 SAMPLES_TOLERANCE=0.05
    SET_KINEMATIC_POSITION Z=0
    G90
    G1 X73 Y-1.5 F40
    G1 Z5 F1000
    # scrub on the tabs
    G1 X18.5 Y-3.5 F6000
    SET_KINEMATIC_POSITION Z=100
    PROBE SAMPLES=2 SAMPLE_RETRACT_DIST=1
    SET_KINEMATIC_POSITION Z=0
    M104 S140
    G1 X18.5 Y-3.5 Z-0.10 F200
    {% for i in range(4) %}
        G1 X18.5 Y-3.5
        G4 P100
        G1 X18.5 Y-3.2
        G1 X14.5 Y-3.2
        G4 P100
        G1 X14.5 Y-3.5
    {% endfor %}
    G1 Z1
    G1 X14 Y-3.5 F1000
    SET_KINEMATIC_POSITION Z=100
    PROBE SAMPLES=1 SAMPLE_RETRACT_DIST=1
    SET_KINEMATIC_POSITION Z=0
    {% for i in range(5) %}
        G1 F100
        G1 Z-0.15
        G1 X14 Y-3.5
        G1 X14 Y-3.5
        G4 P100
        G1 X14 Y-3.2
        G1 X10 Y-3.2
        G4 P100
        G1 X10 Y-3.5
    {% endfor %}
    G90
    G1 Z5 F3000
    M106 S0
    M118 nozzle cleaning end

#--------------------------------------------------------------------
# Start / end / cancel
#--------------------------------------------------------------------
# Start sequence, called from the slicer's machine start G-code:
#   PRINT_START BED_TEMP=[bed_temperature_initial_layer_single] EXTRUDER_TEMP=[nozzle_temperature_initial_layer] PRINT_MIN={first_layer_print_min[0]},{first_layer_print_min[1]} BED_MAX={print_bed_max[0]}
# The same steps as the stock Infimech start G-code: nozzle wipe, Z tilt
# with the bed hot, homing, adaptive mesh, heat up next to the print,
# purge line along the front-left of the print area.
# PRINT_MIN / BED_MAX are optional (default: the slicer's objects, and the
# end of the X axis). Without temperatures it stops a running print with
# a message (the slicer line is broken); outside a print it only resets
# the extruder, as the stock PRINT_START did.
[gcode_macro PRINT_START]
gcode:
    {% if params.BED_TEMP is undefined or params.EXTRUDER_TEMP is undefined %}
        {% if printer.print_stats.state in ["printing", "paused"] %}
            {action_raise_error("PRINT_START needs BED_TEMP and EXTRUDER_TEMP. Check the slicer's machine start G-code: PRINT_START and all its settings must be on one line.")}
        {% endif %}
        G92 E0
    {% else %}
        {% set bed = params.BED_TEMP|float %}
        {% set hotend = params.EXTRUDER_TEMP|float %}
        {% set bed_max = params.BED_MAX|default(printer.toolhead.axis_maximum.x)|float %}
        {% set points = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
        {% if params.PRINT_MIN is defined %}
            {% set pmin = params.PRINT_MIN.split(',')|map('float')|list %}
        {% elif points %}
            {% set pmin = [points|map(attribute=0)|min, points|map(attribute=1)|min] %}
        {% else %}
            {% set pmin = [5.0, 5.0] %}
        {% endif %}
        {% set line_x = pmin[0] - 1.5 %}
        {% set line_y0 = [pmin[1] + 100, bed_max]|min %}
        {% set line_y1 = [0, pmin[1] - 1.5]|max %}
        {% set line_x1 = [pmin[0] + 60, bed_max]|min %}
        # nozzle wipe (also heats the bed)
        M106 P3 S0
        CLEAN_NOZZLE_POSITION BED_TEMP={bed}
        # Z tilt with the bed at temperature
        M140 S{bed}
        M104 S130
        G1 X110 Y110 F10000
        G4 P200
        PROBE
        SET_KINEMATIC_POSITION Z=0
        G1 Z5
        M190 S{bed}
        Z_TILT_ADJUST
        M140 S{bed}
        # home and adaptive mesh
        G1 X5 Y5 F8000
        G28
        BED_MESH_CLEAR
        BED_MESH_CALIBRATE ADAPTIVE=1
        # heat the nozzle next to the print area
        G1 X{line_x} Y{line_y0} F6000
        G1 Z0 F400
        M104 S{hotend}
        M106 S100
        G4 P3000
        M106 S255
        G4 P3000
        M106 S100
        M109 S{hotend}
        M190 S{bed}
        M106 S0
        G92 E0
        G90
        SKEW_PROFILE LOAD=default
        # purge line along the print area
        G1 E3 F300
        G1 X{line_x} Y{line_y0} F6000
        G1 Z0.22 F600
        G1 X{line_x} Y{line_y1} F2000 E10
        G1 Z0.22 F600
        G1 X{line_x1} F1200 E12
        G4 P200
        G1 Z2
        G92 E0
        CLEAR_PAUSE
    {% endif %}

[gcode_macro PRINT_END]
gcode:
    TURN_OFF_HEATERS
    # changed: no retract with a cold nozzle (stock stopped with an error)
    {% if printer.extruder.can_extrude %}
        G92 E0
        G1 E-4.0 F3600
        G4 P100
    {% endif %}
    _PARK_AND_OFF
    M118 PRINT_END
    M84

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
        G92 E0
        G1 E-4.0 F3600
        G4 P100
    {% endif %}
    _PARK_AND_OFF
    M118 CANCEL_PRINT
    M84

# Lift, park at the front left, raise Z out of the way, everything off.
# changed: the moves are skipped when the printer is not homed (stock
# stopped with an error there, before turning the fans and motors off)
[gcode_macro _PARK_AND_OFF]
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% set z = printer.gcode_move.position.z %}
    {% set max_z = printer.toolhead.axis_maximum.z %}
    # stock lift: 100 mm below Z145, 50 mm below Z200, 4 mm below Z245, then 1 mm
    {% set lift, speed = (100, 1200) if z <= 145 else ((50, 600) if z < 200 else ((4, 300) if z < 245 else (1, 100))) %}
    # changed: never past the top of the Z axis (stock stopped with an error there)
    {% set hop = [2, max_z - z]|min %}
    {% set lift = [lift, max_z - z - hop]|min %}
    {% if 'x' in homed and 'y' in homed and 'z' in homed %}
        G91
        {% if hop > 0 %}
            G1 Z{hop} F2000
        {% endif %}
        G4 P50
        G90
        G1 X5 Y5 F7000
        {% if lift > 0 %}
            G91
            G0 Z{lift} F{speed}
        {% endif %}
    {% endif %}
    G90
    M104 S0
    M140 S0
    M106 S0
    M106 P2 S0
    M220 S100
    M221 S100
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1

#--------------------------------------------------------------------
# Pause / resume (also used by the filament runout sensor)
#--------------------------------------------------------------------
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(1)|int %}
    {% set e = params.E|default(1) %}
    {% if not printer.pause_resume.is_paused %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=btemp VALUE={printer.heater_bed.target}
        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE
        # changed: relative mode for both the lift and the retract (stock
        # retracted in absolute mode when it skipped the lift near the top)
        G91
        {% if printer.gcode_move.position.z + z < printer.toolhead.axis_maximum.z %}
            G1 Z{z} F300
        {% else %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        # changed: no retract with a cold nozzle (stock stopped with an error)
        {% if printer.extruder.can_extrude %}
            G1 E-{e} F2100
        {% endif %}
        SAVE_GCODE_STATE NAME=PAUSEPARK
        G90
        G1 X-3 Y-3.5 F6000
        _SAVE_FANS
        M106 S0
        M106 P2 S0
        M106 P3 S0
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
variable_btemp: 0
gcode:
    {% set e = params.E|default(2)|int %}
    {% if printer.pause_resume.is_paused %}
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% if etemp > 0 %}
            M190 S{btemp|int}
            M109 S{etemp|int}
        {% endif %}
        # purge at the park position, then go back
        G91
        G1 E25 F200
        G4 P100
        G1 E-2 F2100
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100
        G91
        M83
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900
        {% else %}
            G1 Z{zhop * -1} F900
        {% endif %}
        M400
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60
        BASE_RESUME
        # changed: fans are restored only when actually resuming
        _RESTORE_FANS
    {% endif %}

# Runs after the filament sensor has paused the print: pushes the rest of
# the filament through, then unloads it
[gcode_macro _FILAMENT_RUNOUT]
gcode:
    PAUSE
    G4 P500
    G91
    M118 Unloading filament...
    G0 E100 F400
    G0 E-70 F3000
    G0 E30 F1000
    M106 S255
    M104 S135
    G4 P50000
    G0 E-75 F3000
    M118 Filament unloaded!
    M106 S0
    M104 S190

#--------------------------------------------------------------------
# Filament load / unload (also on the stock screen)
#--------------------------------------------------------------------
[gcode_macro AUTO_UNLOAD_FILAMENT]
gcode:
    {% set heater_extruder_target = printer.extruder.target|float %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    M118 Heating...
    M109 S{params.TEMP|default(220, true)}
    M118 Unloading filament...
    G0 E30 F200
    G0 E-70 F3000
    G0 E30 F1000
    M106 S255
    M104 S135
    G4 P50000
    G0 E-75 F3000
    M104 S{heater_extruder_target}
    M118 Filament unloaded!
    M106 S0
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro AUTO_LOAD_FILAMENT]
gcode:
    {% set heater_extruder_target = printer.extruder.target|float %}
    # (stock message, kept as is in case the screen looks for it)
    M118 Filament unloaded! { heater_extruder_target }
    SAVE_GCODE_STATE NAME=load_state
    G91
    M118 Heating...
    M109 S{params.TEMP|default(240, true)}
    M118 Loading filament...
    G0 E100 F200
    G4 P1000
    M400
    M109 S{heater_extruder_target}
    M118 Filament loaded!
    RESTORE_GCODE_STATE NAME=load_state

#--------------------------------------------------------------------
# Heat and wait with a tolerance band (stock): nozzle -3/+5, bed -5/+10
#--------------------------------------------------------------------
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|default(0)|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s - 3} MAXIMUM={s + 5}
    {% endif %}

[gcode_macro M190]
rename_existing: M99190
gcode:
    {% set s = params.S|default(0)|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s - 5} MAXIMUM={s + 10}
    {% endif %}
