#OCTO-v1.0.20-20250430
#####################################################################
# Infimech TX V2 - hardware (clean layout for Klipper v0.14)
#
# Mainboard: STM32F072 ("mcu") + Allwinner V853 host ("rpi").
# Pins as on the board wiring diagram. Values are the stock Infimech
# ones unless noted with "changed:".
#
# Calibration values that SAVE_CONFIG may update (PID, z_offset, mesh,
# input shaper, skew) live in printer.cfg, not here.
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_<chip id>-if00
# ^ replace <chip id>: run  ls /dev/serial/by-id/  after flashing the mainline firmware

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
minimum_cruise_ratio: 0.5
max_z_velocity: 30
max_z_accel: 800
square_corner_velocity: 5.0

#--------------------------------------------------------------------
# X / Y (sensorless homing)
#--------------------------------------------------------------------
[stepper_x]
step_pin: PC15
dir_pin: PC14
enable_pin: !PC2
rotation_distance: 39.971
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -5.5
position_endstop: -5.5
position_max: 222
homing_speed: 40
homing_retract_dist: 0
step_pulse_duration: 0.000004

[tmc2209 stepper_x]
uart_pin: PC13
diag_pin: PB4
interpolate: True
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 80

[stepper_y]
step_pin: PA1
dir_pin: PA0
enable_pin: !PA2
rotation_distance: 39.971
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -5
position_endstop: -5
position_max: 225
homing_speed: 40
homing_retract_dist: 0
step_pulse_duration: 0.000004

[tmc2209 stepper_y]
uart_pin: PC3
diag_pin: PB3
interpolate: True
run_current: 1.2
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 97

#--------------------------------------------------------------------
# Z (two lead screws, homed with the piezo bed probe)
#--------------------------------------------------------------------
[stepper_z]
step_pin: PA5
dir_pin: PA4
enable_pin: !PA6
rotation_distance: 8
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_min: -6
position_max: 260
homing_speed: 5
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PA3
interpolate: False
run_current: 0.85
hold_current: 0.5
stealthchop_threshold: 999999

[stepper_z1]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
rotation_distance: 8
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PB1
# changed: False (stock had True), so both Z motors are driven the same way
interpolate: False
run_current: 0.85
hold_current: 0.5
stealthchop_threshold: 999999

#--------------------------------------------------------------------
# Extruder and hotend
#--------------------------------------------------------------------
[extruder]
step_pin: PC5
dir_pin: PC4
enable_pin: !PB12
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.6295166
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
max_extrude_only_velocity: 30
max_extrude_only_accel: 5000
max_extrude_cross_section: 20
instantaneous_corner_velocity: 1.000
pressure_advance: 0.058
pressure_advance_smooth_time: 0.040
heater_pin: PC6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
max_power: 1.0
# changed: 0 (stock had -200, which hid a broken or unplugged thermistor)
min_temp: 0
max_temp: 310
min_extrude_temp: 130
# control / pid_* : in the SAVE_CONFIG block of printer.cfg

[tmc2209 extruder]
uart_pin: PA7
interpolate: True
run_current: 0.7
stealthchop_threshold: 0

[verify_heater extruder]
max_error: 200
check_gain_time: 20
hysteresis: 5
heating_gain: 2

[heater_fan nozzle]
# hotend cooling fan (also cools the mainboard)
pin: PC8
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 40
fan_speed: 1.0

#--------------------------------------------------------------------
# Bed
#--------------------------------------------------------------------
[heater_bed]
heater_pin: PC7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
# changed: 0 (stock had -200, which hid a broken or unplugged thermistor)
min_temp: 0
max_temp: 120
# control / pid_* : in printer.cfg

[verify_heater heater_bed]
max_error: 120
# changed: 60 (stock had 400); this bed gains 2 C in about 7 s from cold
check_gain_time: 60
hysteresis: 10
heating_gain: 2

#--------------------------------------------------------------------
# Temperature sensors
#--------------------------------------------------------------------
[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor HOST]
sensor_type: temperature_host

[temperature_sensor CHAMBER]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB0
min_temp: 0
max_temp: 100
gcode_id: C

#--------------------------------------------------------------------
# Piezo bed probe, Z tilt, bed mesh
#--------------------------------------------------------------------
[smart_effector]
# trigger output of the bed sensor board (Z limit input)
pin: !PD2
probe_accel: 40
recovery_time: 0.4
x_offset: 0
y_offset: 0
speed: 10
samples: 3
sample_retract_dist: 1
samples_result: average
samples_tolerance: 0.04
samples_tolerance_retries: 10
# z_offset: in printer.cfg

[output_pin test_Z]
# signal to the bed sensor board while Z_DOUDONG shakes the bed
pin: rpi:gpio26

[z_tilt]
z_positions:
    -27.9, 108.75
    247.9, 108.75
points:
    5, 108.75
    215, 108.75
speed: 130
horizontal_move_z: 8
retries: 7
retry_tolerance: 0.05

[bed_mesh]
speed: 300
horizontal_move_z: 1
mesh_min: 3, 3
mesh_max: 213, 213
probe_count: 6, 6
algorithm: lagrange
# (bicubic_tension removed: it only applies to bicubic)
mesh_pps: 5, 5
move_check_distance: 3
split_delta_z: .01
fade_start: 1
fade_end: 10
fade_target: 0

#--------------------------------------------------------------------
# Accelerometer / input shaper calibration
#--------------------------------------------------------------------
[adxl345]
cs_pin: rpi:gpio239
spi_bus: spidev3.0

[resonance_tester]
accel_chip: adxl345
probe_points:
    100, 100, 20
# changed: Klipper's default test range (stock limited it to min_freq 30,
# max_freq 80). Re-run the input shaper calibration once.

#--------------------------------------------------------------------
# Filament sensor, light
#--------------------------------------------------------------------
[filament_switch_sensor fila_sensor]
switch_pin: PB5
pause_on_runout: True
# the unload sequence is in macros.cfg
runout_gcode:
    _FILAMENT_RUNOUT
event_delay: 30
pause_delay: 3
# filament must be gone for 10 s (replaces the stock Klipper patch)
debounce_delay: 10

[led LED0]
white_pin: rpi:gpio141
